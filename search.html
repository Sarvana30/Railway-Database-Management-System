<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Railway Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="search-box">
        <h1>Search Trains</h1>
        <form id="search-form">
            <label for="from">From Station</label>
            <input type="text" id="from" placeholder="e.g. New Delhi" required>

            <label for="to">To Station</label>
            <input type="text" id="to" placeholder="e.g. Howrah" required>

            <label for="date">Journey Date</label>
            <input type="date" id="date" required>

            <button type="submit">Search</button>
        </form>
    </div>
</body>
</html>
